        /**
         * Adiciona estilos CSS para elementos SVG dinamicamente.
         * @param {Document} svgDoc O documento SVG.
         */
        function addSvgStyles(svgDoc) {
            const style = svgDoc.createElementNS("http://www.w3.org/2000/svg", "style");
            style.textContent = `
                .interactive-node {
                    cursor: pointer;
                }
                .clickable-overlay {
                    cursor: pointer;
                }
                text {
                    user-select: none;
                    pointer-events: none;
                }
                .link-span {
                    cursor: pointer;
                    display: block;
                    font-size: 14px;
                    color: var(--link-color);
                    font-family: 'Roboto Light', 'Roboto', sans-serif;
                    white-space: nowrap;
                    overflow: hidden; /* Adicionado para lidar com texto que excede a largura */
                    text-overflow: ellipsis; /* Adicionado para truncar o texto com reticências */
                    max-width: 100%; /* Garante que o texto não exceda o foreignObject */
                }
                .link-span:hover {
                    color: var(--link-hover-color);
                }
            `;
            svgDoc.documentElement.prepend(style); // Usar prepend para garantir que o estilo seja o primeiro elemento
        }

        /**
         * Adiciona um ForeignObject (com span de link) abaixo de cada elemento SVG interativo.
         * @param {Document} svgDoc O documento SVG.
         * @param {Array<Object>} linksToAssign Array de objetos de link com `path`, `label`, `url`, `description`.
         */
        function addLinksToSvgElements(svgDoc, linksToAssign) {
            // Map para armazenar o container de cada elemento (evita duplicar o foreignObject)
            const containerMap = new Map();
            
            const FO_WIDTH = 400;
            const MAX_HEIGHT = 300; // Altura máxima antes de aparecer a barra de rolagem
            const INDENTATION = 10;
            const VERTICAL_SPACING = 5;

            linksToAssign.forEach(link => {
                const targetElement = svgDoc.getElementById(link.path);
                if (!targetElement) {
                    console.warn(`Elemento com ID "${link.path}" não encontrado.`);
                    return;
                }
                let divContainer = containerMap.get(targetElement.id);

                // Se é o primeiro link deste elemento, cria o ForeignObject e a Div
                if (!divContainer) {
                    const bbox = targetElement.getBBox();
                    const x = bbox.x + INDENTATION;
                    const y = bbox.y + bbox.height + VERTICAL_SPACING;

                    const foreignObject = svgDoc.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
                    foreignObject.setAttribute('x', x);
                    foreignObject.setAttribute('y', y);
                    foreignObject.setAttribute('width', FO_WIDTH);
                    foreignObject.setAttribute('height', MAX_HEIGHT); // Altura fixa do frame
                    foreignObject.setAttribute('vector-effect', 'non-scaling-stroke');                    

                    let largura = "85%"; 
                    let altura =  "70%";
                    const hookKey = Object.keys(hookfigma).find(key => hookfigma[key] === link.path);
                    if (hookKey){
                        altura =  quadro_figma[hookKey][0]+"%";
                        largura = quadro_figma[hookKey][1]+"%"; 
                        console.warn(quadro_figma[hookKey][0]);
                    }



                    divContainer = svgDoc.createElementNS("http://www.w3.org/1999/xhtml", "div");
                    divContainer.style.cssText = `
                        width: ${largura};
                        height: ${altura}; /* Ocupa toda a altura do foreignObject */
                        overflow-y: auto;
                        overflow-x: hidden;
                        display: flex;
                        flex-direction: column;
                        background: transparent;
                        border: none;
                        #border: 1px solid #ccc;
                        font-size: 14px; /* <--- DEFINA UM TAMANHO FIXO AQUI */
                        box-sizing: border-box;
                    `;

                    foreignObject.appendChild(divContainer);
                    svgDoc.documentElement.appendChild(foreignObject);
                    containerMap.set(targetElement.id, divContainer);
                }

                // Cria o link (span) e adiciona ao container existente
                const span = svgDoc.createElementNS("http://www.w3.org/1999/xhtml", "span");
                span.textContent = link.label;
                span.title = link.description;
                span.className = 'link-span';
                span.style.cssText = `
                    font-size: 14px !important; /* Força o tamanho */
                    flex-shrink: 0;
                    cursor: pointer;
                    display: block;
                    padding: 2px 5px;
                    white-space: nowrap;
                `;
                span.addEventListener('click', () => window.open(link.url, '_blank'));

                divContainer.appendChild(span);

                // Lógica de hover no elemento original (mantida)
                if (!targetElement.classList.contains('interactive-node')) {
                    targetElement.classList.add('interactive-node');
                    targetElement.addEventListener('mouseenter', () => targetElement.classList.add('interactive-node-hover'));
                    targetElement.addEventListener('mouseleave', () => targetElement.classList.remove('interactive-node-hover'));
                }
            });
        }
        /**
         * Atribui IDs a elementos SVG se não tiverem e então adiciona os links.
         */
        function initializeSvgInteractions() {
            const svgObject = document.getElementById('mySvgObject');

            svgObject.addEventListener('load', function() {
                const svgDoc = svgObject.contentDocument;
                if (!svgDoc) {
                    console.error("Não foi possível acessar o conteúdo do SVG. Verifique a política de mesma origem (Same-Origin Policy).");
                    return;
                }

                addSvgStyles(svgDoc); // Adiciona os estilos CSS ao SVG

                const potentialNodes = Array.from(svgDoc.querySelectorAll('path'));
                let idCounter = 0; // Usado para garantir IDs únicos se a geração base não for suficiente

                // Processa apenas uma vez para adicionar IDs e classes
                potentialNodes.forEach(element => {
                    // Otimização: Adiciona a classe interativa se o elemento for um candidato a clique
                    // A lógica original focava em 'fill === white'. Se houver outros critérios, adapte.
                    const fill = element.getAttribute('fill');
                    if (fill === 'white' || fill === '#DBDBDB') { // Mantendo a lógica original para identificar interativos
                        if (!element.id) { // Só gera ID se não tiver um
                            let generatedId;
                            if (element.tagName === 'path') {
                                const dAttribute = element.getAttribute('d');
                                generatedId = `path_${dAttribute.replace(/[^a-zA-Z0-9_]/g, '').substring(0, 50)}`;
                            } else if (element.tagName === 'ellipse' || element.tagName === 'circle') {
                                const cx = element.getAttribute('cx');
                                const cy = element.getAttribute('cy');
                                const safeCx = cx ? cx.replace('.', '_') : '0';
                                const safeCy = cy ? cy.replace('.', '_') : '0';
                                generatedId = `${element.tagName}_${safeCx}_${safeCy}`;
                            }

                            let tempId = generatedId;
                            let uniqueAttempt = 0;
                            // Garante unicidade do ID dentro do SVG
                            while(svgDoc.getElementById(tempId) && svgDoc.getElementById(tempId) !== element) {
                                tempId = `${generatedId}_${uniqueAttempt++}`;
                            }
                            element.id = tempId;
                        }
                    }
                });

                // Agora que todos os IDs estão definidos, adicione os links
                addLinksToSvgElements(svgDoc, linksDataFigma);
            });
        }

        // Inicia o processo quando o DOM estiver completamente carregado
        document.addEventListener('DOMContentLoaded', initializeSvgInteractions);
        // SCRIPT PARA DESATIVAR O LOADER APÓS CARREGAMENTO TOTAL
        window.onload = function() {
            const loader = document.getElementById('page-loader');
            loader.style.opacity = '20%';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500); // 500ms para terminar a animação de fade-out suave
        };
